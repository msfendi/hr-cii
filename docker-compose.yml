services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    depends_on:
      - sqlsrv
    networks:
      - laravel_network

  nginx:
    image: nginx
    container_name: laravel_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/app.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - laravel_network

  sqlsrv:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: laravel_sqlsrv
    environment:
      SA_PASSWORD: "YourStrong!Passw0rd"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    networks:
      - laravel_network
    volumes:
      - sqlsrv_data:/var/opt/mssql

volumes:
  # mysql_data:
  #   driver: local
  sqlsrv_data:
    driver: local

networks:
  laravel_network:
    driver: bridge